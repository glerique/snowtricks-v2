name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      APP_SECRET: ci-only-not-a-secret
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, apcu
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: bin/console cache:warm
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: bin/console doctrine:database:create --env=test --if-not-exists && bin/console doctrine:migrations:migrate --env=test -n --allow-no-migration
      - run: bin/phpunit
