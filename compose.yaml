services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: dev
    ports:
      - "8000:80"
    environment:
      SERVER_NAME: ":80"
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  database_data:
